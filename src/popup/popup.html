<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vercel Folders</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header>
        <img src="icons/icon-32.png" width="20" height="20" alt="">
        <h1>Vercel Folders</h1>

        <span id="label">Enabled</span>

    <p class="hint">Show folders on vercel.com dashboards</p>
    <script src="popup.js"></script>
</body>
</html>
